name: Historical icon metadata tests

on:
  pull_request:
    paths:
      - "HistoricalContent/historical_content/__init__.py"
      - "HistoricalContent/historical_content/icon_manifest_dimensions.py"
      - "HistoricalContent/historical_content/image_dimensions.py"
      - "HistoricalContent/historical_content/vpk_pipeline.py"
      - "HistoricalContent/tests/test_icon_dimensions.py"
      - "HistoricalContent/requirements.txt"
      - ".github/workflows/historical-icon-metadata-tests.yml"
  push:
    branches: [main]
    paths:
      - "HistoricalContent/historical_content/__init__.py"
      - "HistoricalContent/historical_content/icon_manifest_dimensions.py"
      - "HistoricalContent/historical_content/image_dimensions.py"
      - "HistoricalContent/historical_content/vpk_pipeline.py"
      - "HistoricalContent/tests/test_icon_dimensions.py"
      - "HistoricalContent/requirements.txt"
      - ".github/workflows/historical-icon-metadata-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: HistoricalContent/requirements.txt
      - run: python -m pip install --requirement HistoricalContent/requirements.txt
      - env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s HistoricalContent/tests -p "test_icon_dimensions.py" -v
