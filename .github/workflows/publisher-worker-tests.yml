name: Publisher and Worker tests

on:
  pull_request:
    paths:
      - "ContentPublisher/**"
      - "ContentDeliveryWorker/**"
      - ".github/workflows/publisher-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "ContentPublisher/**"
      - "ContentDeliveryWorker/**"
      - ".github/workflows/publisher-worker-tests.yml"

permissions:
  contents: read

jobs:
  publisher:
    name: Publisher safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ContentPublisher/requirements.txt
      - run: python -m pip install --requirement ContentPublisher/requirements.txt
      - env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s ContentPublisher/tests -v

  worker:
    name: Worker safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ContentDeliveryWorker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm test
