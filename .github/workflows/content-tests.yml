name: Historical Content and Worker tests

on:
  pull_request:
    paths:
      - "HistoricalContent/**"
      - "ContentPublisher/**"
      - "ContentDeliveryWorker/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "HistoricalContent/**"
      - "ContentPublisher/**"
      - "ContentDeliveryWorker/**"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  historical-content:
    name: Historical Content (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: npm ci --omit=dev
        working-directory: HistoricalContent
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth
      - name: Run full suite with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m unittest discover -s HistoricalContent/tests -v
      - name: Run full suite with Windows credentials and Tk
        if: runner.os == 'Windows'
        run: python -m unittest discover -s HistoricalContent/tests -v

  worker:
    name: Worker safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ContentDeliveryWorker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm test
